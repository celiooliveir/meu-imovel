name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend — Unit + E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: meu_imovel
          POSTGRES_PASSWORD: password
          POSTGRES_DB: meu_imovel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meu_imovel -d meu_imovel_test"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci
        working-directory: backend

      - name: Unit tests
        run: npx jest --no-coverage --passWithNoTests
        working-directory: backend

      - name: E2E tests
        run: npx jest --config test/jest-e2e.json --no-coverage --forceExit
        working-directory: backend
        env:
          DATABASE_URL: postgresql://meu_imovel:password@localhost:5432/meu_imovel_test
          JWT_SECRET: ci-secret-placeholder-min-64-chars-aaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_SECRET: ci-refresh-placeholder-min-64-chars-bbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          JWT_REFRESH_EXPIRES_IN: 30d
          NODE_ENV: test

  mobile-typecheck:
    name: Mobile — TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install
        run: npm ci --legacy-peer-deps
        working-directory: mobile

      - name: Generate Expo env types
        run: echo '/// <reference types="expo/types/env.d" />' > expo-env.d.ts
        working-directory: mobile

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: mobile
