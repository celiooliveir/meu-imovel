version: '3.9'

services:
  postgres:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_USER: meu_imovel
      POSTGRES_PASSWORD: password
      POSTGRES_DB: meu_imovel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meu_imovel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
